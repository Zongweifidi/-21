name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Create assets folder
        run: mkdir -p focus_hero/assets/animations

      - name: Get dependencies
        working-directory: focus_hero
        run: flutter pub get

      - name: Build APK
        working-directory: focus_hero
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-hero-apk
          path: focus_hero/build/app/outputs/flutter-apk/app-debug.apk
